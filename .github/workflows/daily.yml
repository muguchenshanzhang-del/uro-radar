name: 每日文献雷达

on:
  schedule:
    # UTC 23:30 = 北京时间 07:30。GitHub 的 cron 会延迟几分钟到半小时，正常。
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "build 正常出报并推送；test-push 只发一条测试消息；doctor 只自检模型接口"
        type: choice
        options: [build, test-push, doctor]
        default: build

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 这个项目零依赖，不需要 pip install
      - name: 运行
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # 推送通道：配了哪个用哪个，都不配就跳过推送
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          MODE="${{ github.event.inputs.mode || 'build' }}"
          echo "mode=$MODE"
          case "$MODE" in
            doctor)    python main.py doctor ;;
            test-push) python main.py notify --test ;;
            *)         python main.py build --days 10 ;;
          esac

      # 状态文件要提交回去：去重记录、已生成的中文速读、已推送过的记号都在里面。
      # 不提交的话明天会把同样的文献再推一遍、再花一次钱。
      # （摘要原文在本地 radar.db 里，不进仓库）
      - name: 提交状态
        if: ${{ (github.event.inputs.mode || 'build') != 'doctor' && (github.event.inputs.mode || 'build') != 'test-push' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: radar $(date -u +%F)"
            git push
          else
            echo "状态没有变化"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: ${{ (github.event.inputs.mode || 'build') == 'build' }}
        with:
          path: public

  deploy:
    needs: build
    if: ${{ (github.event.inputs.mode || 'build') == 'build' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
