# =====================================================================
# 泌尿外科文献雷达 · 配置文件
# 改这个文件就够了，不需要改代码。
# =====================================================================

[general]
# 每次抓取回溯多少天（PubMed 的 edat 窗口）
days = 10
# 页面最多展示多少篇（按分数排序后的上限）
limit = 90
# Crossref 每本期刊最多取多少条（10 天窗口 40 条够用，期刊密集期可以调大）
crossref_rows = 60
# PubMed 一次最多取多少条
pubmed_retmax = 600
# 库里保留多少天，超过就删（控制 db 体积）
prune_days = 365
# Crossref 礼貌池要求留邮箱，建议改成你自己的
mailto = "your@email.com"
user_agent = "uro-radar/0.1 (mailto:your@email.com)"
# 时区只影响页面上的「今天」显示
timezone = "Asia/Shanghai"

[scoring]
# 期刊层级的权重：score += tier * tier_weight
# tier 5 的社论不能压过 tier 3 的 RCT，所以这里不能给太高
tier_weight = 10
# 命中一个兴趣词的加分
interest_weight = 2
# 兴趣词总共最多加多少分（防止关键词刷分）
interest_cap = 10
# 近 N 天内发表的加分
fresh_days = 3
fresh_bonus = 4

[llm]
# 是否生成中文速读。关掉就只显示英文原摘要。
enabled = true
# 任意 OpenAI 兼容接口都行。opencode-go 的网关是 zen；换成 DeepSeek 官方就是
# https://api.deepseek.com/v1 + deepseek-flash
base_url = "https://opencode.ai/zen/v1"
model = "deepseek-v4.1-flash"
# 从环境变量读 key，别写在这个文件里
api_key_env = "LLM_API_KEY"
# 这个网关会挡掉 python-urllib 的默认 UA（Cloudflare 1010），必须给浏览器 UA
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36"
# 每次请求塞几篇，太大容易超时/被截断
batch = 6
# 每天最多给多少篇生成中文速读（按分数从高到低），控制成本
max_per_run = 30

[render]
title = "泌尿外科文献雷达"
subtitle = "Crossref × PubMed · 每日高分文献"
# 顶部「本周必读」展示几篇
top_n = 5

# =====================================================================
# 兴趣词：命中标题/摘要就加分。按你现在的方向调。
# =====================================================================
interests = [
  "SEER", "MIMIC", "NHANES", "NIS", "nationwide", "population-based",
  "nomogram", "machine learning", "deep learning", "radiomics",
  "randomized", "trial", "non-inferiority",
  "urolithiasis", "stone", "ureteroscopy", "PCNL", "retrograde intrarenal",
  "BPH", "LUTS", "enucleation", "HoLEP", "aquablation",
  "urosepsis", "sepsis", "urinary tract infection",
  "bladder cancer", "BCG", "cystectomy", "neoadjuvant",
  "prostate cancer", "PSMA", "radical prostatectomy", "focal therapy",
  "kidney cancer", "partial nephrectomy", "renal mass",
  "testicular", "penile", "urethral",
  "incontinence", "overactive bladder", "neurogenic",
  "vasectomy", "infertility", "erectile",
  "telehealth", "ambulatory", "day surgery", "ERAS",
]

# =====================================================================
# 期刊池：tier 5=旗舰 4=一线 3=主流 2=补充
# issn 用于 Crossref（哪个能通就用哪个），abbr 必须是 PubMed 的 NLM 缩写
# 加了新期刊后先跑 `python main.py check` 看两边都能不能抓到
# =====================================================================

